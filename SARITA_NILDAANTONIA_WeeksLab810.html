<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Dashboard – Week 8-10 Lab</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #F3F4F6; 
      color: #374151; 
    }

    header { 
      background: #0A2342; 
      color: white; 
      padding: 20px 40px; 
    }
    header h1 { 
      font-size: 1.6rem; 
    }
    header p  { 
      font-size: 0.9rem; 
      color: #93C5FD; 
      margin-top: 4px; 
    }

    .toolbar { 
      background: white; 
      padding: 16px 40px; 
      border-bottom: 2px solid #E5E7EB; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toolbar input { 
      padding: 8px 14px; 
      border: 1px solid #D1D5DB; 
      border-radius: 6px; 
      width: 260px; 
    }
    .toolbar strong {
      color: #374151;
      font-size: 0.95rem;
    }

    .main { 
      padding: 30px 40px; 
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); 
      gap: 20px; 
    }

    .card { 
      background: white; 
      border-radius: 8px; 
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1); 
      border-top: 3px solid #028090; 
    }
    .card h3 { 
      font-size: 0.95rem; 
      color: #0A2342; 
      margin-bottom: 8px; 
    }
    .card p  { 
      font-size: 0.87rem; 
      color: #6B7280; 
      line-height: 1.5; 
    }

    .tag { 
      display: inline-block; 
      background: #EFF6FF; 
      color: #1E40AF;
      border-radius: 4px; 
      padding: 2px 8px; 
      font-size: 0.78rem; 
      margin-bottom: 10px;
    }

    .loading { 
      text-align: center; 
      padding: 60px; 
      color: #6B7280; 
      font-size: 1.1rem; 
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Blog Dashboard</h1>
      <p>Web Systems Lab – Weeks 8 to 10</p>
    </header>
    <!-- Stats bar -->
    <div class="toolbar">
      <input type="text" v-model="search" placeholder="Search posts by title...">
      <div>
        <strong>Total Posts: {{ filteredPosts.length }}</strong>
        &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;
        <strong>Authors: {{ users.length }}</strong>
      </div>
    </div>

    <div class="main">
      <p v-if="loading" class="loading">Loading posts from REST API...</p>

      <div v-else class="grid">
        <div v-for="post in filteredPosts" :key="post.id" class="card">
          <span class="tag">Post #{{ post.id }}</span>
          <h3>{{ post.title }}</h3>
          <p>{{ post.body }}</p>
          <p style="margin-top:10px; font-size:.8rem; color:#028090;">
            <strong>By: {{ getAuthor(post.userId) }}</strong>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        // Reactive data arrays
        const posts   = ref([]);
        const users   = ref([]);
        const loading = ref(true);
        const search  = ref('');

         // onMounted = runs once when the app loads (like componentDidMount in React)

        onMounted(async () => {
          try {
            // Fetch posts and users at the same time using Promise.all
            const [postsRes, usersRes] = await Promise.all([
              fetch('https://jsonplaceholder.typicode.com/posts'),
              fetch('https://jsonplaceholder.typicode.com/users'),
            ]);

            posts.value = await postsRes.json();   // stores 100 posts
            users.value = await usersRes.json();   // stores 10 users
          } catch (error) {
            console.error('API fetch failed:', error);
          } finally {
            loading.value = false;
          }
        });

        
        const filteredPosts = computed(() => {
          return posts.value.filter(post => 
            post.title.toLowerCase().includes(search.value.toLowerCase())
          );
        });

        // Helper: find a user's name by their userId
        const getAuthor = (userId) => {
          const user = users.value.find(u => u.id === userId);
          return user ? user.name : 'Unknown Author';
        };

      
        return { posts, users, loading, search, filteredPosts, getAuthor };
      }
    }).mount('#app');
  </script>
</body>
</html>
